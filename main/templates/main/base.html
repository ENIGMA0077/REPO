<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enigma Encyclopedia 🌌</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #0b1020, #05070f);
            color: white;
            overflow-x: hidden;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 20, 40, 0.6);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            border-bottom: 1px solid rgba(0,255,255,0.2);
        }

        header h1 {
            font-size: 18px;
            color: #00e5ff;
            letter-spacing: 1px;
        }

        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 10px;
            transition: 0.3s;
        }

        nav a:hover {
            background: #00e5ff;
            color: black;
            transform: translateY(-3px);
        }

        .container {
            padding: 30px;
        }

        footer {
            text-align: center;
            padding: 20px;
            opacity: 0.5;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <video id="bgVideo" autoplay muted loop playsinline></video>

    <canvas id="space"></canvas>


<header>
    <h1>🌌 Enigma Encyclopedia</h1>
    <nav>
        <a href="/">Home</a>
        <a href="/galaxies/">🌌 Galaxy Archive</a>
    </nav>
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

<footer>
    Enigma Encyclopedia © 2026
</footer>
<script>
document.querySelectorAll(".card").forEach(card => {

    card.addEventListener("mousemove", (e) => {

        const rect = card.getBoundingClientRect();

        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -15;
        const rotateY = ((x - centerX) / centerX) * 15;

        card.style.transform =
            `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
    });

    card.addEventListener("mouseleave", () => {
        card.style.transform = "rotateX(0deg) rotateY(0deg) scale(1)";
    });

});
</script>

<script>
function breakCard(event, card) {

    event.preventDefault();

    const url = card.href;

    const rect = card.getBoundingClientRect();

    for (let i = 0; i < 25; i++) {

        const piece = document.createElement("div");

        piece.className = "glass-piece";

        piece.style.left =
            rect.left + rect.width / 2 + "px";

        piece.style.top =
            rect.top + rect.height / 2 + "px";

        document.body.appendChild(piece);

        const angle = Math.random() * Math.PI * 2;
        const force = Math.random() * 300;

        const x = Math.cos(angle) * force;
        const y = Math.sin(angle) * force;

        piece.animate([
            {
                transform: "translate(0,0) scale(1)",
                opacity: 1
            },
            {
                transform:
                    `translate(${x}px, ${y}px)
                     rotate(${Math.random()*720}deg)
                     scale(0)`,

                opacity: 0
            }
        ], {
            duration: 1000,
            easing: "ease-out"
        });

        setTimeout(() => piece.remove(), 1000);
    }

    card.style.transition = "0.35s";
    card.style.transform =
        "scale(0.1) rotate(20deg)";
    card.style.opacity = "0";

    setTimeout(() => {
        window.location.href = url;
    }, 300);
}
</script>


<script>

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let mouse = {
    x: window.innerWidth / 2,
    y: window.innerHeight / 2
};

window.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

const stars = [];

for(let i = 0; i < 140; i++){

    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speed: Math.random() * 0.3
    });
}

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    stars.forEach(star => {

        let dx = mouse.x - star.x;
        let dy = mouse.y - star.y;

        star.x += dx * 0.00002;
        star.y += dy * 0.00002;

        star.y += star.speed;

        if(star.y > canvas.height){
            star.y = 0;
        }

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "white";

        ctx.shadowBlur = 12;
        ctx.shadowColor = "cyan";

        ctx.fill();
    });

    requestAnimationFrame(animate);
}

animate();

</script>

<script>
window.addEventListener("pageshow", () => {

    document.querySelectorAll(".card").forEach(card => {

        card.style.opacity = "1";

        card.style.transform =
            "rotateX(0deg) rotateY(0deg) scale(1)";
    });

});

{% comment %} const isMobile = window.innerWidth < 768;

const starsCount = isMobile ? 40 : 140;

if (!isMobile) {
    ctx.shadowBlur = 12;
    ctx.shadowColor = "cyan";
}

if (isMobile) {
    document.getElementById("space").remove();
} {% endcomment %}

</script>


<script>
const video = document.getElementById("bgVideo");

const backgrounds = {
    milkyway: "/static/video/milkyway.mp4",
    andromeda: "/static/video/andromeda.mp4",
    deepspace: "/static/video/ton618.mp4"
};

document.querySelectorAll(".card").forEach(card => {

    card.addEventListener("mouseenter", () => {

        const bg = card.dataset.bg;

        if (!backgrounds[bg]) return;

        video.style.opacity = 0;

        setTimeout(() => {
            video.src = backgrounds[bg];
            video.load();
            video.play().catch(()=>{});
            video.style.opacity = 1;
        }, 200);
    });

});
</script>

<script>
function warpJump(url) {

    document.body.style.transition = "0.6s";
    document.body.style.transform = "scale(0.95)";
    document.body.style.filter = "blur(8px) brightness(0.5)";

    setTimeout(() => {
        window.location.href = url;
    }, 500);
}

</script>

</body>
</html>
